<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protocolos de Pruebas – EVI</title>
<style>:root { --rojo: #E5322D; --amarillo: #FFE600; --gris: #2F3337; --fondo: #eef0f2; --borde: #c9cdd2; --ok: #0a7d2c; --bad: #c8102e; --warn: #ffe27a; --miss: #fff3b0; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; color: #1d2125; background: var(--fondo); display: flex; flex-direction: column; }
header { background: var(--gris); color: #fff; display: flex; align-items: center; gap: 12px; padding: 6px 12px; flex-wrap: wrap; border-bottom: 4px solid var(--rojo); }
header .marca { font-weight: 700; font-size: 16px; white-space: nowrap; }
header .marca span { color: var(--amarillo); }
#pasos { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.paso { background: transparent; border: 1px solid #5b6168; color: #dfe3e6; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.paso b { display: inline-block; width: 20px; height: 20px; line-height: 20px; border-radius: 50%; background: #5b6168; color: #fff; text-align: center; font-size: 12px; margin-right: 4px; }
.paso.activo { background: var(--amarillo); color: #000; border-color: var(--amarillo); font-weight: 600; }
.paso.activo b { background: var(--rojo); }
header .der { display: flex; gap: 6px; align-items: center; }
header .der .btn { background: #454b51; color: #fff; border-color: #5b6168; }
#guardado { font-size: 12px; color: #aab; margin-right: 6px; }
.sub { background: #fff; padding: 5px 14px; font-size: 13px; color: #444; border-bottom: 1px solid var(--borde); }
main { flex: 1; display: grid; grid-template-columns: minmax(420px, 46%) 1fr; min-height: 0; }
#form { overflow: auto; padding: 14px 18px 30px; background: #fff; border-right: 1px solid var(--borde); }
#preview { overflow: auto; padding: 8px; background: #8a9096; }
body.sin-prev main { grid-template-columns: 1fr; }
body.sin-prev #preview { display: none; }
body.prev-grande main { grid-template-columns: minmax(360px, 32%) 1fr; }
h2 { margin: 4px 0 10px; font-size: 20px; color: var(--gris); }
h3 { margin: 18px 0 8px; font-size: 15px; color: var(--gris); }
fieldset { border: 1px solid var(--borde); border-radius: 8px; margin: 0 0 12px; padding: 10px 12px 12px; }
legend { font-weight: 700; padding: 0 6px; color: var(--gris); }
fieldset.prueba > legend { background: var(--gris); color: #fff; border-radius: 4px; padding: 2px 10px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 10px; }
.g2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 10px; }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; } .span4 { grid-column: span 4; }
.mt { margin-top: 10px; }
.campo { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: #444; min-width: 0; }
.campo > span { font-weight: 600; }
input, select, textarea { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid #b7bcc2; border-radius: 5px; background: #fff; min-width: 0; width: 100%; }
td input, td select { width: auto; padding: 4px 6px; }
textarea { width: 100%; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--amarillo); border-color: #a08f00; }
input[data-req]:placeholder-shown, input[data-req][value=""] { background: var(--miss); }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; margin: 4px 14px 4px 0; }
.chk input { width: 18px; height: 18px; }
.fila-in { display: flex; gap: 6px; align-items: center; }
.ayuda { font-size: 12px; color: #5a6168; margin: 6px 0; }
.btn { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 6px; border: 1px solid #aab0b6; background: #f4f5f6; cursor: pointer; color: #1d2125; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: #e7e9eb; }
.btn.prim { background: var(--rojo); color: #fff; border-color: var(--rojo); }
.btn.prim:hover { background: #c92a25; }
.btn.chico { padding: 3px 9px; font-size: 13px; }
.btn.grande { padding: 14px 20px; font-size: 16px; font-weight: 600; background: var(--gris); color: #fff; border-color: var(--gris); }
.btn.grande.sec { background: #fff; color: var(--gris); }
.btn.off { opacity: .45; }
.btn.peligro { color: var(--bad); }
.botones { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
.nav-pie { display: flex; justify-content: space-between; margin-top: 16px; }
.tipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tipo { text-align: left; border: 2px solid var(--borde); border-radius: 10px; padding: 12px; background: #fff; cursor: pointer; display: flex; flex-direction: column; gap: 3px; font: inherit; }
.tipo:hover { border-color: var(--rojo); }
.tipo.activo { border-color: var(--rojo); background: #fff6f5; }
.tipo b { font-size: 17px; color: var(--rojo); }
.tipo small { color: #777; }
.tipo .acc { display: flex; gap: 6px; margin-top: 6px; }
table.ed { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
table.ed th { background: #f1f2f4; font-weight: 600; font-size: 12px; padding: 4px 6px; border: 1px solid #dde0e3; }
table.ed td { padding: 3px 5px; border: 1px solid #e5e7ea; vertical-align: middle; }
table.ed td.mini { font-size: 11px; color: #666; }
table.ed tr.sel td { background: #fff6d5; }
.calc { font-variant-numeric: tabular-nums; }
.calc.b { font-weight: 700; }
.calc.ok, td.ok { color: var(--ok); font-weight: 700; }
.calc.bad { color: var(--bad); font-weight: 700; }
.calc.warn, td.warn { background: var(--warn); padding: 0 3px; }
.pasos:not(:empty) { background: #f4f9fd; border: 1px solid #cfe3f3; border-radius: 6px; padding: 8px 10px; margin-top: 8px; font-size: 12.5px; line-height: 1.55; font-family: Consolas, monospace; }
.sub-t { font-weight: 700; margin: 10px 0 4px; font-size: 13px; }
.inst-sel { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; }
.inst-sel select { width: auto; }
.pruebas { display: flex; flex-wrap: wrap; }
.val { margin: 0 0 8px; padding-left: 18px; }
.v-err { color: var(--bad); }
.v-av { color: #8a6d00; }
.ok-box { color: var(--ok); font-weight: 700; }
.firmas-ed { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.firma-ed { border: 1px dashed var(--borde); border-radius: 8px; padding: 8px; }
.mini-firma { height: 34px; border: 1px solid #ddd; background: #fff; }
.mini-hoja { height: 120px; border: 1px solid #ddd; }
td.na { color: #aaa; text-align: center; }
.usos { white-space: nowrap; }
.tag { font-size: 11px; padding: 2px 5px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; margin: 1px; }
.tag.on { background: var(--gris); color: #fff; border-color: var(--gris); }
.pers { padding-left: 18px; }
.pers li { margin: 4px 0; }
.verif td.ok { color: var(--ok); }
/* Modal */
.modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 50; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow: auto; }
.modal.abierto { display: flex; }
.modal-in { background: #fff; border-radius: 10px; padding: 16px 20px; width: min(1100px, 100%); }
.m-cab { display: flex; justify-content: space-between; align-items: center; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
.filtros input, .filtros select { width: auto; }
.filtros #f-q { flex: 1; min-width: 220px; }
.tabla-db { max-height: 55vh; overflow: auto; }
.tabla-db table { width: 100%; }
.acc { white-space: nowrap; }
.acc .btn { margin-right: 4px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--gris); color: #fff; padding: 10px 18px; border-radius: 8px; transition: transform .25s; z-index: 60; max-width: 90vw; }
.toast.ver { transform: translateX(-50%) translateY(0); }
#print { display: none; }
#print.midiendo { display: block; position: absolute; left: -99999px; top: 0; }

/* ===== Hoja del protocolo ===== */
.hoja-wrap { margin: 0 auto 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); background: #fff; }
.hoja { --cel: #DDEBF7; --cel2: #BDD7EE; --cel3: #9BC2E6; width: 297mm; height: 210mm; padding: 6mm 7mm; background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; font-size: 8pt; line-height: 1.2; overflow: hidden; }
.hoja.vert { width: 210mm; height: 297mm; }
.hoja.membrete { background-size: 210mm 297mm; background-repeat: no-repeat; background-position: 0 0; padding: 37mm 19mm 30mm 19mm; }
#preview .hoja { transform-origin: top left; transform: scale(var(--esc, .5)); }
.hoja-in { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.marco { border: 1.3pt solid #000; background: transparent; }
.vert .marco { font-size: 6.6pt; }
table.x { width: 100%; border-collapse: collapse; table-layout: fixed; background: transparent; }
table.x + table.x { margin-top: -0.6pt; }
.x td { border: 0.5pt solid #000; padding: 0.35mm 0.8mm; text-align: center; vertical-align: middle; font-size: 7.4pt; line-height: 1.15; background: transparent; overflow: hidden; }
.vert .x td { font-size: 6.6pt; padding: 0.25mm 0.6mm; }
.x td.b, .x tr.b td { font-weight: 700; }
.x td.l { text-align: left; }
.x td.r { text-align: right; }
.x td.titulo { font-weight: 700; font-size: 8.6pt; padding: 0.8mm 2mm; position: relative; }
.vert .x td.titulo { font-size: 7.6pt; }
.x td.titulo .pag { position: absolute; right: 2mm; top: 50%; transform: translateY(-50%); font-weight: 400; font-size: 6.5pt; }
.x td.cel { background: #0DC0FF; color: #fff; font-weight: 700; }
.bar { background: #00B0F0; color: #fff; font-weight: 700; padding: 0.35mm 1mm; font-size: 7.4pt; border-left: 0.5pt solid #000; border-right: 0.5pt solid #000; }
.vert .bar { font-size: 6.6pt; padding: 0.25mm 0.8mm; }
.bar.bar0 { background: #0DC0FF; }
.x.dt td { white-space: nowrap; text-overflow: ellipsis; }
.x.rel td:nth-child(4) { font-weight: 700; }
.x.rel tr:first-child td, .x.rel tr:nth-child(2) td { font-weight: 700; }
.x.rel tr:nth-child(2) td:nth-child(2) { font-weight: 700; }
.lado { display: flex; }
.lado > table.x { flex: 1 1 50%; width: 50%; }
.lado > table.x + table.x { margin-top: 0; margin-left: -0.5pt; }
.nota { font-size: 6pt; color: #333; padding: 0.2mm 1mm; }
.sub { font-weight: 700; font-size: 6.8pt; padding: 0.5mm 1mm; border-left: 0.5pt solid #000; border-right: 0.5pt solid #000; }
.x.obs td { min-height: 4mm; height: 4mm; }
.x.firmas td { border-color: #000; }
.x.firmas tr:not(.f-fila) td { border-top: 0; border-bottom: 0; }
.x.firmas tr:first-child td { border-top: 0.5pt solid #000; }
.x.firmas tr.f-fila td { border-top: 0.5pt solid #000; }
.x.firmas tr:not(.f-fila) td:nth-child(even) { border-left: 0; }
.x.firmas td.f-celda { height: 23mm; vertical-align: top; text-align: center; position: relative; padding-top: 0.5mm; }
.x.firmas td.f-celda .l { text-align: left; }
.x.firmas td.f-celda img { max-height: 18mm; max-width: 90%; display: block; margin: 0.5mm auto 0; }
.x td.vacio { height: 4.6mm; }
.x td.miss { background: var(--miss); color: #999; }
.x td.warn { background: var(--warn); }
.x td.nconf { color: var(--bad); font-weight: 700; }
.x td.na { color: #999; }
.blank .x td.miss { background: none; }
/* Protocolo de servicio (formato de campo) */
.hoja.serv { padding: 9mm 10mm; }
.serv .marco { font-size: 8.5pt; }
.serv .x td { font-size: 8.5pt; padding: 0.8mm 1mm; }
.serv .x td.titulo { font-size: 10pt; padding: 1.5mm 2mm; }
.serv .x td.teo { font-size: 9.5pt; }
.serv .x tr.fill td { height: 10mm; }
.serv .x td.llenar { font-size: 11pt; font-weight: 700; }
.serv .bar { font-size: 9pt; padding: 1mm 2mm; }
.serv .sub { font-size: 8.5pt; padding: 1mm 2mm; }

@media print {
  html, body { height: auto; background: #fff; display: block; }
  body > *:not(#print) { display: none !important; }
  #print { display: block !important; position: static !important; }
  .hoja { page-break-after: always; break-after: page; box-shadow: none; }
  .hoja:last-child { page-break-after: auto; break-after: auto; }
  td.miss { background: none !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
#btn-vista { display: none; }
/* Celular / pantallas angostas: formulario o vista previa, uno a la vez */
@media (max-width: 900px) {
  main, body.prev-grande main { grid-template-columns: 1fr; }
  body.ver-prev #form { display: none; }
  body:not(.ver-prev) #preview { display: none; }
  #form { border-right: 0; padding: 10px 10px 80px; }
  #form fieldset { overflow-x: auto; }
  .g4 { grid-template-columns: repeat(2, 1fr); }
  .g2 { grid-template-columns: 1fr; }
  header { gap: 6px; padding: 6px 8px; }
  header .marca { display: none; }
  #pasos { flex-wrap: nowrap; }
  .sub { font-size: 11px; padding: 3px 8px; }
  .paso { padding: 6px 8px; font-size: 0; }
  .paso b { font-size: 12px; margin: 0; }
  .paso.activo { font-size: 13px; }
  .paso.activo b { margin-right: 4px; }
  #guardado { display: none; }
  header .der .btn { padding: 5px 8px; font-size: 13px; }
  .tipos { grid-template-columns: 1fr; }
  #btn-vista { display: inline-flex; position: fixed; right: 12px; bottom: 14px; z-index: 20; padding: 12px 16px; border-radius: 24px; box-shadow: 0 3px 10px rgba(0,0,0,.35); }
  body.sin-prev #btn-vista { display: none; }
}
</style>
<style id="estilo-pagina">@page { size: A4 landscape; margin: 0; }</style>
</head>
<body>
<header>
  <div class="marca">EVI <span>·</span> Protocolos de pruebas</div>
  <nav id="pasos"></nav>
  <div class="der"><span id="guardado"></span><button class="btn" data-a="protocolos">📁 Protocolos</button><button class="btn" data-a="ajustes">⚙ Ajustes</button></div>
</header>
<div class="sub">Editando: <b id="actual"></b></div>
<main>
  <section id="form"></section>
  <section id="preview"></section>
</main>
<button id="btn-vista" class="btn prim" data-a="vista">👁 Vista previa</button>
<div id="print"></div>
<div id="modal" class="modal"><div class="modal-in" id="modal-c"></div></div>
<div id="toast" class="toast"></div>
<div id="listas"></div><div id="listas-p"></div>

// Pruebas de cortocircuito que corresponden:
// - una por cada tensión de alta;
// - si la baja tiene 2 tensiones en bobinas independientes, una por cada bobina (cada una tiene su propia impedancia);
// - si es una sola bobina con derivación, una sola prueba cortocircuitando la bobina completa (la tensión mayor).
function ccNecesarios(p) {
  var t = p.tec, bts = t.bt.map(N), vistos = {}, out = [];
  var mayor = 0; bts.forEach(function (v, j) { if (OK(v) && v > (bts[mayor] || 0)) mayor = j; });
  var lista = bts.length > 1 && t.btTipo === 'independiente' ? bts.map(function (v, j) { return j; }) : [bts.length > 1 ? mayor : 0];
  t.niveles.forEach(function (nv, i) {
    if (vistos[nv.v]) return; vistos[nv.v] = 1;
    lista.forEach(function (j) { out.push({ nivel: i, bt: j }); });
  });
  return out;
}
function ccPorDefecto(p) {
  p.med.cc.rows = ccNecesarios(p).map(function (x) { return { nivel: x.nivel, bt: x.bt, tap: '', I: '', V: '', W: ['', '', ''], tamb: '' }; });
}
// Ajusta las filas de cortocircuito a la ficha, conservando lo ya medido
function sincronizarCC(p) {
  if (p.tipo && TIPOS[p.tipo] && TIPOS[p.tipo].auto) return;
  var viejas = p.med.cc.rows || [];
  p.med.cc.rows = ccNecesarios(p).map(function (x) {
    var v = viejas.filter(function (r) { return +r.nivel === x.nivel && (r.bt === undefined || r.bt === '' || +r.bt === x.bt) && !r._usada; })[0];
    if (v) v._usada = true;
    return v ? Object.assign(v, { bt: x.bt }) : { nivel: x.nivel, bt: x.bt, tap: '', I: '', V: '', W: ['', '', ''], tamb: '' };
  });
  p.med.cc.rows.forEach(function (r) { delete r._usada; });
}

// Mediciones de aislamiento que corresponden. Con 2 bobinas B.T. independientes son 6:
// MT-BT1, MT-BT2, BT1-BT2, MT-M, BT1-M, BT2-M (cada bobina aislada de la otra, de la M.T. y de masa)
function aisNecesarios(p) {

  if (t.auto || base.length !== 3 || p.tec.bt.length < 2 || p.tec.btTipo !== 'independiente') return base;

  var vXY = base[0].v, vXM = base[1].v, vYM = base[2].v;
  return [{ lbl: X + '-' + Y + '1', v: vXY }, { lbl: X + '-' + Y + '2', v: vXY }, { lbl: Y + '1-' + Y + '2', v: vYM },
    { lbl: X + '-M', v: vXM }, { lbl: Y + '1-M', v: vYM }, { lbl: Y + '2-M', v: vYM }];
}

  function alias(l) { return String(l).replace(new RegExp('\\b' + y + '1\\b'), y); }
  var out = nuevas.map(function (n) {
    var v = viejas.filter(function (r) { return r.lbl === n.lbl; })[0] || viejas.filter(function (r) { return alias(r.lbl) === n.lbl || r.lbl === alias(n.lbl); })[0];
    return { lbl: n.lbl, v: v ? v.v : n.v, val: v ? v.val : '' };
  });
  var todas = {}; aisNecesarios(Object.assign({}, p, { tec: Object.assign({}, p.tec, { btTipo: 'independiente', bt: [1, 2] }) })).concat((t.ais || []).map(function (a) { return { lbl: a[0] }; })).forEach(function (n) { todas[n.lbl] = 1; });
  viejas.forEach(function (r) { if (!todas[r.lbl]) out.push(r); });

// Conversión del cortocircuito al 100 % de In, paso a paso (para el Excel y el paso 3)
function pasosCC(c, E, p) {
  var D = Calc.fmtD, S = E.S, nV = function (x) { return String(+(+x).toFixed(2)); }, Vn = c.vtap, I = N(c.row.I), V = N(c.row.V), k = c.factor;
  var W = (c.row.W || []).slice(0, E.fases === 1 ? 1 : 3).map(N).filter(OK);
  var L = [];
  L.push('1) Corriente nominal de la posición: In = ' + (E.fases === 1 ? 'S / Vn = ' + Math.round(S) + ' / ' + nV(Vn) : 'S / (√3 × Vn) = ' + Math.round(S) + ' / (1.732 × ' + nV(Vn) + ')') + ' = ' + D(c.In) + ' A');
  L.push('2) Corriente alcanzada: I / In = ' + D(I) + ' / ' + D(c.In) + ' = ' + Calc.fmt(c.pctI, 2) + ' % de In');
  L.push('3) Factor de conversión: k = In / I = ' + D(c.In) + ' / ' + D(I) + ' = ' + k.toFixed(4));
  L.push('4) Tensión al 100 %: V100 = V medida × k = ' + D(V) + ' × ' + k.toFixed(4) + ' = ' + D(c.VIn) + ' V');
  L.push('5) Tensión de cortocircuito: Vcc = V100 / Vn × 100 = ' + D(c.VIn) + ' / ' + nV(Vn) + ' × 100 = ' + D(c.Vcc) + ' %');
  L.push('6) Pérdidas medidas: Wt = ' + (W.length > 1 ? W.map(D).join(' + ') + ' = ' : '') + D(c.Pmed) + ' W');
  L.push('7) Pérdidas al 100 % (varían con el cuadrado de la corriente): P100 = Wt × k² = ' + D(c.Pmed) + ' × ' + k.toFixed(4) + '² = ' + D(c.Pmed) + ' × ' + (k * k).toFixed(4) + ' = ' + D(c.PIn) + ' W');
  if (p.opt.modoCorr === 'iec') L.push('8) Corrección a ' + E.tref + ' °C según IEC 60076-1: P = ' + D(c.Pref) + ' W, Vcc = ' + D(c.Vccref) + ' %');
  else {
    L.push('8) Pérdidas a ' + (OK(E.tref) ? E.tref : 75) + ' °C: P100 × 1.05 = ' + D(c.PIn) + ' × 1.05 = ' + D(c.Pref) + ' W');
    L.push('9) Vcc a ' + (OK(E.tref) ? E.tref : 75) + ' °C: Vcc × 1.05 = ' + D(c.Vcc) + ' × 1.05 = ' + D(c.Vccref) + ' %');
  }

function fmtTension(v) { v = N(v); if (!OK(v)) return ''; return v >= 1000 ? Calc.kv(v) + ' kV' : Calc.fmtV(v) + ' V'; }

/* Estructura derivada (todo lo que se calcula a partir de la ficha) */
function estructura(p, cfg) {

  E.S = N(tec.pot) * (tec.potU === 'kVA' ? 1000 : 1);

  E.s3 = cfg.s3 || 'exacto';

    var r = p.med.rel[i] || {};
    var n = Math.max(0, Math.round(N(nv.n) || 0));
    var vbt = N(tec.bt[N(nv.bt) || 0]);
    var taps = Calc.tapVoltages(nv.v, n, nv.pct, r.ov);
    var dis = N(r.dis);
    var teo = taps.map(function (vt) { return OK(dis) ? dis * vt / N(nv.v) : Calc.relTeorica(vt, vbt, nv.g, E.auto, E.s3); });
    var bornes = Calc.bornesRel(nv.g, tec.bornes, E.auto);
    if (E.mono) bornes = bornes.slice(0, 1);
    return { i: i, v: N(nv.v), vbt: vbt, g: nv.g, n: n, pct: N(nv.pct), taps: taps, labels: Calc.tapLabels(n, tec.tapEstilo), teo: teo, bornes: bornes, dis: dis };
  });
  E.atV = unicos(E.niveles.map(function (n) { return n.v; }).filter(OK));
  E.enKV = Math.max.apply(null, E.atV.concat([0])) >= 1000;
  E.InAT = E.atV.map(function (v) { return Calc.corriente(E.S, v, E.fases); });
  E.btV = tec.bt.map(N);
  E.InBT = E.btV.map(function (v) { return Calc.corriente(E.S, v, E.fases); });
  E.mtTxt = listaTension(E.atV, E.enKV);
  E.btTxt = listaTension(E.btV, E.enKV);
  var grupos = unicos(E.niveles.map(function (n) { return n.g; }));
  E.grupoTxt = grupos.length <= 1 ? (grupos[0] || '') :
    E.atV.map(function (v) { var nv = E.niveles.filter(function (n) { return n.v === v; })[0]; return nv.g + ' (' + fmtTension(v) + ')'; }).join(' – ');
  var regs = [];
  E.atV.forEach(function (v) {
    var nv = E.niveles.filter(function (n) { return n.v === v; })[0];
    if (nv.n > 0) regs.push('±' + nv.n + '×' + nv.pct + ' %' + (E.atV.length > 1 ? ' (' + fmtTension(v) + ')' : ''));

  } else {

    E.atV.forEach(function (v, j) {
      E.resRows.push({ key: 'AT' + j, lado: 'AT', v: v, lbl: tec.lados[0] + ' ' + fmtTension(v), cols: Calc.bornesRes('AT', g0, tec.bornes, E.mono), u: 'Ω', pn: false });
    });

/* Validación: devuelve [{nivel:'error'|'aviso', msg}] */
function validar(p, E) {
  var L = [];
  function err(m) { L.push({ nivel: 'error', msg: m }); }
  function av(m) { L.push({ nivel: 'aviso', msg: m }); }
  function falta(x) { return x === '' || x === undefined || x === null || (typeof x === 'number' && !isFinite(x)); }
  if (falta(p.cab.cliente)) err('Falta el cliente.');
  var serv = !!E.t.servicio;
  if (!serv && falta(p.cab.ot)) err('Falta el N° de OT.');
  if (!serv && falta(p.cab.serie)) err('Falta el N° de serie.');
  if (!serv && !E.tmm && !OK(E.S)) err('Falta la potencia.');
  if (!E.atV.length) err('Falta la tensión ' + p.tec.lados[0] + '.');
  if (!E.btV.filter(OK).length) err('Falta la tensión ' + p.tec.lados[1] + '.');
  p.tec.niveles.forEach(function (nv) { if (!Calc.parseGrupo(nv.g).valido) err('Grupo de conexión no reconocido: "' + nv.g + '".'); });
  var pr = p.pruebas;
  if (pr.ais) p.med.ais.rows.forEach(function (r) { if (!OK(Calc.parseOhm(r.val))) err('Aislamiento: falta ' + r.lbl + '.'); });
  if (pr.res) E.resRows.forEach(function (r) {
    for (var i = 0; i < r.cols.length; i++) if (!OK(N(r.vals[i]))) { err('Resistencia de devanados: faltan valores en ' + r.lbl + '.'); break; }
    if (r.alerta) av('Desbalance de ' + Calc.fmt(r.desb, 2) + ' % en ' + r.lbl + '.');
  });
  if (pr.rel) E.rels.forEach(function (nv) {
    var falt = nv.filas.filter(function (f) { return f.lect.filter(function (x) { return OK(N(x)); }).length < nv.bornes.length; }).length;
    if (falt) err('Relación ' + fmtTension(nv.v) + ' / ' + fmtTension(nv.vbt) + ': faltan lecturas en ' + falt + ' posición(es).');
    nv.filas.forEach(function (f) { if (f.ok === false) av('Relación ' + fmtTension(nv.v) + ' pos. ' + f.label + ': error ' + Calc.fmt(f.err, 2) + ' % → NO CONFORME.'); });
  });
  if (pr.vac) {
    if (!OK(E.vac.P0) || !OK(E.vac.Iavg)) err('Vacío: faltan corrientes o vatímetros.');
    if (E.vac.alerta) av('Vacío: P₀ supera en ' + Calc.fmt(E.vac.dif, 1) + ' % al diseño (tolerancia +15 %).');
  }
  if (pr.cc) E.cc.forEach(function (c) {
    if (!OK(c.PIn) || !OK(c.Vcc)) err('Cortocircuito ' + fmtTension(c.nivel.v) + ': faltan I, V o vatímetros.');
    if (OK(c.pctI) && c.pctI < 50) av('Cortocircuito ' + fmtTension(c.nivel.v) + ': se llegó solo al ' + Calc.fmt(c.pctI, 1) + ' % de In. La IEC 60076-1 pide al menos el 50 % para referir las pérdidas a In.');
    if (!OK(N(c.row.tamb))) err('Cortocircuito ' + fmtTension(c.nivel.v) + ': falta la temperatura ambiente.');
    if (p.opt.modoCorr === 'iec' && OK(c.PIn) && !OK(c.PI2R)) err('Cortocircuito (modo IEC): faltan las resistencias de devanados.');
    if (c.alertaV) av('Vcc ' + Calc.fmt(c.Vccref, 2) + ' % difiere ' + Calc.fmt(c.difV, 1) + ' % del diseño (±10 %).');
    if (c.alertaP) av('Pcc supera en ' + Calc.fmt(c.difP, 1) + ' % al diseño (+15 %).');
  });
  if (pr.apl) E.apl.forEach(function (r) {
    if (!r.res) err('Tensión aplicada: falta el resultado de ' + r.lbl + '.');
    if (r.res === 'NO CONFORME') av('Tensión aplicada ' + r.lbl + ': NO CONFORME.');

  if (pr.ind) { if (!E.ind.res) err('Tensión inducida: falta el resultado.'); if (E.ind.res === 'NO CONFORME') av('Tensión inducida: NO CONFORME.'); }

/* ---------- Firmas escaneadas ---------- */
function normNombre(n) { return String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim(); }
// Firma guardada para una persona: primero la de Ajustes (''= quitada), luego las incluidas en la app
function firmaDe(cfg, nombre) {
  var n = normNombre(nombre); if (!n) return '';
  function buscar(obj) {
    for (var k in obj) { var m = normNombre(k); if (m && (m === n || m.indexOf(n) === 0 || n.indexOf(m) === 0)) return { v: obj[k] }; }
    return null;
  }
  var r = buscar((cfg && cfg.firmasImg) || {}) || buscar(typeof FIRMAS_DEF !== 'undefined' ? FIRMAS_DEF : {});
  return r ? r.v || '' : '';
}
// Imagen que va en el protocolo (vacía si se eligió dejar las firmas en blanco)
function firmaImg(p, cfg, f) {

function sincronizarFicha(p) { sincronizarCC(p); sincronizarAis(p); }

/* ===== Render del protocolo con el formato EVI (vista previa / PDF / hoja de campo) ===== */
function instTxt(cfg, id) {

  if (!i || !(i.marca || i.modelo)) return '';

  var extra = [];
  if (i.serie) extra.push('S/N ' + i.serie);

}
function fechaTxt(f) { if (!f) return ''; var m = String(f).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3] + '/' + m[2] + '/' + m[1] : f; }
// Valor medido tal como se escribió (coma → punto)
function crudo(v) { return v === undefined || v === null ? '' : String(v).trim().replace(',', '.'); }
// Valor medido con decimales fijos: 3 si es menor que 10, si no 2 (dd); relación siempre 3 (d3)
function dd(v) { if (typeof v === 'number') return OK(v) ? Calc.fmtD(v) : ''; var t = crudo(v); return t !== '' && OK(N(t)) ? Calc.fmtD(N(t)) : t; }
function d3(v) { if (typeof v === 'number') return OK(v) ? v.toFixed(3) : ''; var t = crudo(v); return t !== '' && OK(N(t)) ? N(t).toFixed(3) : t; }

// Imágenes grandes (hoja membretada, firmas): se convierten una sola vez a blob: URL
// para no volver a decodificar cientos de KB en cada tecla de la vista previa
var IMG_CACHE = {};
function imgURL(src) {
  if (!src || !/^data:/.test(src) || typeof Blob === 'undefined' || !window.URL || !URL.createObjectURL) return src;
  if (IMG_CACHE[src]) return IMG_CACHE[src];

    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return (IMG_CACHE[src] = URL.createObjectURL(new Blob([u], { type: m[1] })));
  } catch (e) { return src; }
}

              '<tr>' + r.cols.map(function (c, i) { return v(dd(r.vals[i])); }).join('') + relleno + '</tr>';
          });
          return s + '</table>';
        };
        var uA = (izq[0] || {}).u || 'Ω', uB = (der[0] || {}).u || 'mΩ';
        var tA = E.tmm ? 'RESISTENCIA TT (' + uA + ')' : seco ? 'RESISTENCIA BOBINA ' + (E.auto ? 'DE ENTRADA' : 'PRIMARIA') + ' (' + uA + ')' : 'RESISTENCIA  M.T. (' + uA + ')';
        var tB = E.tmm ? 'RESISTENCIA TC' : seco ? 'RESISTENCIA BOBINA ' + (E.auto ? 'DE SALIDA' : 'SECUNDARIA') + ' (' + uB + ')' : 'RESISTENCIA  B.T. (' + uB + ')';
        h += '<div class="lado">' + mitad(izq, tA) + mitad(der, tB) + '</div>';
        var tm = N(p.med.res.tmed);
        if (OK(tm) && !B) h += '<div class="nota">Temperatura de medición: ' + tm + ' °C</div>';
        break;
      case 'rel':
        h = bar('rel');
        E.rels.forEach(function (nv) {
          var nb = nv.bornes.length, mono = nb === 1;
          var wl = mono ? [12, 15, 15, 16, 16, 13, 13] : [12, 14, 13, 14].concat(Array(nb).fill(35 / nb)).concat([12]);
          h += '<table class="x rel">' + cols(wl) +
            '<tr><td rowspan="2" class="b">Posición</td><td colspan="2" class="b">TENSIONES COMPARADAS</td><td rowspan="2" class="b">Relación Teórica</td>' +
            nv.bornes.map(function (b) { return '<td class="b">' + b[0].replace('-', ' - ') + '</td>'; }).join('') + '<td class="b">% Error</td>' + (mono ? '<td rowspan="2" class="b">RESULTADO</td>' : '') + '</tr>' +
            '<tr><td class="b">V1</td><td class="b">V2</td>' + nv.bornes.map(function (b) { return '<td class="b">' + b[1].replace('-', ' - ') + '</td>'; }).join('') + '<td class="b">≤ 0.5%</td></tr>';
          nv.filas.forEach(function (f) {
            var nom = f.ti === nv.n && nv.n > 0 ? ' class="b"' : '';
            h += '<tr' + nom + '><td>' + f.label + '</td><td>' + Math.round(f.vat) + '</td><td>' + nv.vbt + '</td><td class="b">' + Calc.fmtRel(f.teo) + '</td>' +
              nv.bornes.map(function (b, i) { return v(d3(f.lect[i])); }).join('') +
              v(OK(f.err) ? F(f.err, 2) + '%' : '', f.ok === false ? 'nconf' : '') + (mono ? res(f.ok) : '') + '</tr>';
          });
          h += '</table>';
        });
        break;
      case 'vac':
        var vac = p.med.vac, vtxt = sinEsp(Calc.fmtV(E.vac.V)) + (E.vac.Vat ? ' / ' + Math.round(E.vac.Vat) : '');
        var P0 = dd(E.vac.P0);
        h = bar('vac');
        if (E.mono) {
          h += '<table class="x">' + cols([25, 8, 25, 8, 34]) +
            '<tr><td colspan="2" class="b">TENSION (' + (t.bornes === 'P' ? 'S1 - S2' : 'X1 - X2') + ')</td><td colspan="2" class="b">INTENSIDAD</td><td class="b">PERDIDA DE NUCLEO</td></tr>' +
            '<tr><td>Lectura</td><td>Unidad</td><td>Lectura</td><td>Unidad</td><td>Wr</td></tr>' +
            '<tr><td>' + vtxt + '</td><td>V</td>' + v(dd(vac.I[0])) + '<td>A</td>' + v(P0, 'b') + '</tr></table>';
        } else {
          var etI = t.bornes === 'H' ? ['INTENSIDAD (H1)', 'INTENSIDAD (H2)', 'INTENSIDAD (H3)'] : ['INTENSIDAD (Iu)', 'INTENSIDAD (Iv)', 'INTENSIDAD (Iw)'];
          h += '<table class="x">' + cols([12, 5, 9, 4, 9, 4, 9, 4, 10, 10, 10, 14]) +
            '<tr><td colspan="2" class="b">TENSION</td>' + etI.map(function (x) { return '<td colspan="2" class="b">' + x + '</td>'; }).join('') +
            '<td colspan="3" class="b">WATIMETROS</td><td rowspan="2" class="b">PERDIDA NÚCLEO</td></tr>' +
            '<tr><td colspan="2">Lectura</td>' + etI.map(function () { return '<td colspan="2">Lectura</td>'; }).join('') + '<td>W1</td><td>W2</td><td>W3</td></tr>' +
            '<tr><td>' + vtxt + '</td><td>V</td>' + vac.I.slice(0, 3).map(function (x) { return v(dd(x)) + '<td>A</td>'; }).join('') +
            vac.W.slice(0, 3).map(function (x) { return B ? v('') : '<td>' + dd(x) + '</td>'; }).join('') + v(P0, 'b') + '</tr></table>';
        }
        break;
      case 'cc':
        var tref = OK(E.tref) ? E.tref : 75, ta = E.cc.length && OK(N(E.cc[0].row.tamb)) ? N(E.cc[0].row.tamb) : 25;
        h = bar('cc') + '<table class="x">' + cols([12, 9, 5, 9, 5, 16, 11, 11, 11, 11]) +
          '<tr><td rowspan="3" class="b">Posición</td><td colspan="2" class="b">INTENSIDAD</td><td colspan="2" class="b">TENSION</td><td class="b">VATIMETROS</td><td colspan="2" rowspan="2" class="b">PERDIDAS EN LOS DEVANADOS</td><td colspan="2" rowspan="2" class="b">TENSION DE CORTO CIRCUITO</td></tr>' +
          '<tr><td colspan="2" rowspan="2">Lectura</td><td colspan="2" rowspan="2">Lectura</td><td rowspan="2">Wt</td></tr>' +
          '<tr><td>a ' + ta + ' º C</td><td>a ' + tref + ' º C</td><td>a ' + ta + ' º C</td><td>a ' + tref + ' º C</td></tr>';
        E.cc.forEach(function (c) {
          var pos = (c.nivel.n > 0 && p.tec.tapEstilo !== 'num' ? c.label + '<br>' : '') + Math.round(c.vtap) + (E.btV.length > 1 ? ' / ' + c.vbt : '');
          // Si no se llegó a la corriente nominal, el protocolo muestra los valores ya llevados al 100 % de In
          var parcial = OK(c.factor) && c.factor !== 1;
          var cI = dd(parcial ? c.In : c.row.I), cV = dd(parcial ? c.VIn : c.row.V);
          var cW = dd(parcial ? c.PIn : c.Pmed);
          h += '<tr><td>' + pos + '</td>' + v(cI) + '<td>A</td>' + v(cV) + '<td>V</td>' + v(cW) +
            v(dd(c.PIn)) + v(dd(c.Pref), c.alertaP ? 'warn' : '') + v(dd(c.Vcc)) + v(dd(c.Vccref), c.alertaV ? 'warn' : '') + '</tr>';
        });
        h += '</table>';
        if (p.opt.modoCorr === 'iec' && !B) h += '<div class="nota">Corrección a ' + tref + ' °C según IEC 60076-1 (k = ' + E.k + ').</div>';
        break;
      case 'apl':
        h = bar('apl', '(1 minuto - 60 Hz)') + '<table class="x">' + cols([24, 8, 12, 10, 12, 8, 7, 19]) +
          '<tr><td></td><td colspan="2" class="b">TENSION</td><td colspan="2" class="b">INTENSIDAD</td><td colspan="2" class="b">TIEMPO</td><td class="b">RESULTADO</td></tr>' +
          E.apl.map(function (r) {
            return '<tr><td>' + esc(r.lbl) + '</td><td class="r">' + (OK(r.kV) ? r.kV : '') + '</td><td class="l">KV.</td>' + v(dd(r.mA), 'r') + '<td class="l">mA</td><td class="r">' + esc(r.t) + '</td><td class="l">seg.</td>' + res(r.res) + '</tr>';
          }).join('') + '</table>';
        break;
      case 'ind':
        var I = E.ind;
        h = bar('ind', '(1 minuto - ' + esc(I.f) + ' Hz)') + '<table class="x">' + cols([18, 22, 22, 16, 22]) +
          '<tr><td class="b">Posición</td><td class="b">TENSIÓN</td><td class="b">INTENSIDAD</td><td class="b">TIEMPO</td><td class="b">RESULTADO</td></tr>' +
          '<tr><td class="b">' + (E.btV[0] || '') + ' V</td><td>' + Math.round(I.V) + ' V</td>' + v(dd(I.I) ? dd(I.I) + ' A' : '') + '<td>' + esc(I.t) + ' seg.</td>' + res(I.res) + '</tr></table>';
        break;
      case 'ace':
        var ac = p.med.ace;
        h = bar('ace', '(' + esc(ac.norma) + ')') + '<table class="x"><tr><td class="b">T amb (°C)</td><td class="b">Aceite</td>' + ac.lect.map(function (x, i) { return '<td class="b">' + (i + 1) + ' (kV)</td>'; }).join('') + '<td class="b">Promedio (kV)</td><td class="b">Mínimo (kV)</td><td class="b">RESULTADO</td></tr>' +
          '<tr>' + v(crudo(ac.tamb)) + '<td>' + esc(ac.tipo || t.aceite) + '</td>' + ac.lect.map(function (x) { return v(dd(x)); }).join('') + v(dd(E.ace.prom), 'b') + '<td>' + esc(ac.min) + '</td>' + res(E.ace.ok) + '</tr></table>';
        break;
      case 'rui':
        h = bar('rui') + '<table class="x">' + cols([40, 60]) + '<tr><td class="b">Nivel de ruido</td>' + v(crudo(p.med.rui.db) ? crudo(p.med.rui.db) + ' dB' : '') + '</tr></table>';
        break;
      case 'pre':
        if (!E.pre) break;
        var tmm = t.tmm || {};
        h = bar('pre', '(IEC 61869)');
        h += '<div class="sub">TRANSFORMADOR DE TENSIÓN – CLASE ' + esc(tmm.ttClase) + ' (límites ±' + E.pre.limTT[0] + ' % y ±' + E.pre.limTT[1] + '′) – ' + esc(tmm.ttPot) + '</div>';
        h += '<table class="x"><tr><td rowspan="2" class="b">Bornes</td><td rowspan="2" class="b">Carga</td>' + [80, 100, 120].map(function (x) { return '<td colspan="2" class="b">' + x + ' % Un</td>'; }).join('') + '<td rowspan="2" class="b">RESULTADO</td></tr><tr>' +
          [80, 100, 120].map(function () { return '<td>ε (%)</td><td>δ (′)</td>'; }).join('') + '</tr>';
        E.pre.tt.forEach(function (r) { h += '<tr><td>' + r.par + '</td><td>' + r.carga + '</td>' + [80, 100, 120].map(function (x) { var q = r.ptos[x] || []; return v(crudo(q[0])) + v(crudo(q[1])); }).join('') + res(r.ok) + '</tr>'; });
        h += '</table><div class="sub">TRANSFORMADOR DE CORRIENTE – CLASE ' + esc(tmm.tcClase) + ' – ' + esc(tmm.tcPot) + '</div>';
        h += '<table class="x"><tr><td rowspan="2" class="b">Fase</td><td rowspan="2" class="b">Carga</td>' + [1, 5, 20, 100, 120].map(function (x) {
          var lim = Calc.limTC(tmm.tcClase, x);
          return '<td colspan="2" class="b">' + x + ' % In' + (lim ? '<br><small>±' + lim[0] + ' % / ±' + lim[1] + '′</small>' : '') + '</td>';
        }).join('') + '<td rowspan="2" class="b">RESULTADO</td></tr><tr>' + [1, 5, 20, 100, 120].map(function () { return '<td>ε (%)</td><td>δ (′)</td>'; }).join('') + '</tr>';
        E.pre.tc.forEach(function (r) {
          h += '<tr><td>' + r.fase + '</td><td>' + r.carga + '</td>' + [1, 5, 20, 100, 120].map(function (x) {
            if (!Calc.limTC(tmm.tcClase, x)) return '<td class="na">–</td><td class="na">–</td>';
            var q = r.ptos[x] || []; return v(crudo(q[0])) + v(crudo(q[1]));
          }).join('') + res(r.ok) + '</tr>';
        });
        h += '</table>';
        break;
    }
    S[pr.id] = '<div class="sec">' + h + '</div>';
  });

  var orden = ['ais', 'res', 'rel', 'vac', 'cc', 'apl', 'ind', 'ace', 'rui'];
  var paginas = [orden.map(function (i) { return S[i] || ''; }).join('')];
  if (E.tmm && S.pre) paginas.push(S.pre);
  var mem = !!p.opt.membrete, vert = mem || p.opt.orient === 'portrait', total = paginas.length;
  var fondo = mem ? ' style="background-image:url(' + imgURL(cfg.hoja || HOJA_DEF) + ')"' : '';
  return paginas.map(function (cuerpo, i) {
    var ultima = i === total - 1;
    return (opts.wrap ? '<div class="hoja-wrap">' : '') + '<div class="hoja ' + (vert ? 'vert' : 'horiz') + (mem ? ' membrete' : '') + (B ? ' blank' : '') + '"' + fondo + '><div class="hoja-in"><div class="marco">' +
      encabezado(p, E, i + 1, total, B) + (i === 0 ? datosTecnicos(p, E, LD, unidV) : '') + cuerpo +
      (ultima ? observaciones(p, E, B) + firmas(p, cfg, B) : '') + '</div></div></div>' + (opts.wrap ? '</div>' : '');
  }).join('');
}

function encabezado(p, E, pag, total, B) {
  return '<table class="x"><colgroup><col style="width:14%"><col style="width:58%"><col style="width:10%"><col style="width:18%"></colgroup>' +
    '<tr><td colspan="4" class="titulo">' + esc(tituloProtocolo(p, E)) + (B ? ' – HOJA DE CAMPO' : '') + (total > 1 ? '<span class="pag">Página ' + pag + ' de ' + total + '</span>' : '') + '</td></tr>' +
    '<tr><td class="cel l">CLIENTE</td><td class="b">' + esc(p.cab.cliente) + (p.cab.proyecto ? ' – ' + esc(p.cab.proyecto) : '') + '</td><td class="cel l">O.T.</td><td class="b">' + esc(p.cab.ot) + '</td></tr></table>';
}

function datosTecnicos(p, E, LD, unidV) {
  var t = p.tec, c1, c2, c3, seco = !!E.t.seco;
  var tcc = OK(E.vccMedido) ? Calc.fmt(E.vccMedido, 1) : (t.vccD !== '' ? t.vccD : '');
  var mt = E.atV.map(function (x) { return E.enKV ? Calc.kv(x) : x; }).join(' - ');
  var bt = E.btV.filter(OK).map(function (x) { return E.enKV ? Calc.kv(x) : x; }).join(' - ');
  var grupos = unicos(E.niveles.map(function (n) { return n.g; })).join(' - ');
  var inAT = E.InAT.map(Calc.fmtI).join(' - '), inBT = E.InBT.map(Calc.fmtI).join(' - ');
  if (E.tmm) {
    var m = t.tmm || {};
    c1 = [['Marca', p.cab.marca], ['N° de Serie', p.cab.serie], ['Tipo', p.tipo], ['Año', p.cab.anio], ['Norma', p.cab.norma], ['Frecuencia', t.frec + ' Hz']];
    c2 = [['Relación TT', m.relTT], ['Potencia / clase TT', [m.ttPot, m.ttClase].filter(Boolean).join(' – cl. ')], ['Relación TC', m.relTC], ['Potencia / clase TC', [m.tcPot, m.tcClase].filter(Boolean).join(' – cl. ')], ['Conexión', m.conexion], ['Polaridad', m.polaridad]];
    c3 = [['Nivel de Aislamiento', t.aisMT, 'KV BIL'], ['Ith', m.ith, 'kA'], ['Idyn', m.idyn, 'kA'], ['Montaje', t.montaje], ['Refrigeración', t.refr], ['Aceite', t.aceite], ['Altitud', t.alt, 'm.s.n.m.'], ['T amb máx.', m.tambMax, '°C'], ['Peso total', t.pesoTotal, 'Kg.']];
  } else {
    c1 = [['Marca', p.cab.marca], ['N° de Serie', p.cab.serie], ['Tipo', p.tipo], ['Año', p.cab.anio], ['Norma', p.cab.norma], ['Frecuencia', t.frec + ' Hz'], [seco ? 'Vcc' : 'Tcc', tcc !== '' ? tcc + ' %' : '']];
    c2 = [['Potencia', t.potDet || t.pot, t.potDet ? '' : t.potU.toUpperCase()], ['Tensión Nom. ' + LD[0], mt, unidV], ['Tensión Nom. ' + LD[1], bt, unidV], ['Grupo de conexión', grupos]];
    if (seco) c2 = c2.concat([['Clase de Aislamiento', t.clase], ['Refrigeración', t.refr], ['Montaje', t.montaje]]);
    else c2 = c2.concat([['Montaje', t.montaje], ['Refrigeración', t.refr], ['Aceite', t.aceite]]);
    c3 = [['Nivel de Aislamiento ' + LD[0], t.aisMT, 'KV BIL'], ['Nivel de Aislamiento ' + LD[1], t.aisBT, 'KV BIL'], ['Corriente Nominal ' + LD[0], inAT, 'A.'], ['Corriente Nominal ' + LD[1], inBT, 'A.'], ['Altitud', t.alt, 'm.s.n.m.']];
    if (!seco && t.pesoAceite !== '' && t.pesoAceite !== undefined) c3.push(['Peso aceite', t.pesoAceite, 'Kg.']);
    if (t.pesoParte !== '' && t.pesoParte !== undefined) c3.push(['Peso parte activa', t.pesoParte, 'Kg.']);
    c3.push(['Peso total', t.pesoTotal, 'Kg.']);
    if (seco && t.ip) c3.push(['Grado de Protección', t.ip]);
  }
  var n = Math.max(c1.length, c2.length, c3.length);
  var h = '<div class="bar bar0">DATOS TECNICOS DEL EQUIPO</div><table class="x dt"><colgroup>' +
    [10, 16, 14, 14, 6, 21, 11, 8].map(function (w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>';
  function cel(r, negrita, sinU) {
    if (sinU) return r ? '<td class="l">' + esc(r[0]) + '</td><td' + (negrita ? ' class="b"' : '') + '>' + esc([r[1], r[2]].filter(Boolean).join(' ')) + '</td>' : '<td></td><td></td>';
    if (!r) return '<td></td><td></td><td></td>';
    return '<td class="l">' + esc(r[0]) + '</td><td' + (negrita ? ' class="b"' : '') + '>' + esc(r[1]) + '</td><td class="l">' + esc(r[2] || '') + '</td>';
  }
  for (var i = 0; i < n; i++) h += '<tr>' + cel(c1[i], i === 0, true) + cel(c2[i]) + cel(c3[i]) + '</tr>';
  return h + '</table>';
}

function observaciones(p, E, B) {
  var txt = p.obsManual ? p.obs : obsAuto(p, E);
  var lineas = B ? ['', ''] : String(txt || '').split('\n');
  while (lineas.length < 2) lineas.push('');
  return '<div class="bar">OBSERVACIONES</div><table class="x obs">' + lineas.map(function (l) { return '<tr><td class="l b">' + (esc(l) || '&nbsp;') + '</td></tr>'; }).join('') + '</table>';
}

function firmas(p, cfg, B) {
  var f = p.firmas.slice(0, 4), w = 100 / f.length;
  var col = '<colgroup>' + f.map(function () { return '<col style="width:' + (w * 0.4) + '%"><col style="width:' + (w * 0.6) + '%">'; }).join('') + '</colgroup>';
  function emp(x) { return x.empresa || (/cliente/i.test(x.rol) ? p.cab.cliente : ''); }
  return '<table class="x firmas">' + col +
    '<tr>' + f.map(function (x) { return '<td class="l">' + esc(x.rol) + ':</td><td class="l b">' + esc(emp(x)) + '</td>'; }).join('') + '</tr>' +
    '<tr>' + f.map(function (x) { return '<td></td><td class="l">' + esc(x.nombre) + '</td>'; }).join('') + '</tr>' +
    '<tr>' + f.map(function (x) { return '<td class="l">Fecha :</td><td class="l">' + esc(B ? '' : fechaTxt(x.fecha || p.cab.fecha)) + '</td>'; }).join('') + '</tr>' +
    '<tr class="f-fila">' + f.map(function (x) { return '<td colspan="2" class="f-celda"><div class="l">Firma :</div>' + (!B && firmaImg(p, cfg, x) ? '<img src="' + imgURL(firmaImg(p, cfg, x)) + '" alt="">' : '') + '</td>'; }).join('') + '</tr></table>';
}

/* ===== Protocolo de servicio: formato de campo (aislamiento, resistencia y relación) =====
   A4 vertical sin membrete ni firmas. Las celdas para llenar se agrandan hasta ocupar la hoja (ajustarHojas). */
function renderServicio(p, cfg, opts) {
  var B = !!opts.blank, E = estructura(p, cfg), F = Calc.fmt, t = p.tec, LD = ladosEVI(E);
  function cols(a) { return '<colgroup>' + a.map(function (w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>'; }
  function llenar(x) { return '<td class="llenar">' + (B || x === undefined || x === null ? '' : esc(x)) + '</td>'; }
  function tens(x) { return x >= 1000 ? Calc.kv(x) + ' kV' : x + ' V'; }
  var pot = t.potDet || (OK(N(t.pot)) ? t.pot + ' ' + t.potU : '');
  var titulo = 'PROTOCOLO DE SERVICIO – ' + t.titulo + (pot ? ' DE ' + pot.toUpperCase() : '');
  var grupos = unicos(E.niveles.map(function (n) { return n.g; })).join(' – ');
  var mt = E.atV.map(tens).join(' – ') + (E.atV.length === 1 && E.regTxt ? ' (' + E.regTxt + ')' : '');
  var bt = E.btV.filter(OK).map(tens).join(' – ') + (E.btV.length > 1 && !E.auto ? (t.btTipo === 'independiente' ? ' (bobinas independientes)' : ' (bobina con derivación)') : '');

  function cabecera(pag, total) {
    return '<table class="x">' + cols([16, 44, 14, 26]) +
      '<tr><td colspan="4" class="titulo">' + esc(titulo) + (total > 1 ? '<span class="pag">Página ' + pag + ' de ' + total + '</span>' : '') + '</td></tr>' +
      '<tr><td class="cel l">CLIENTE</td><td class="b l">' + esc(p.cab.cliente) + (p.cab.proyecto ? ' – ' + esc(p.cab.proyecto) : '') + '</td><td class="cel l">O.T.</td><td class="b">' + esc(p.cab.ot) + '</td></tr>' +
      (pag > 1 ? '' :
        '<tr><td class="cel l">TENSIÓN ' + LD[0] + '</td><td class="b l">' + esc(mt) + '</td><td class="cel l">N° SERIE</td><td class="b">' + esc(p.cab.serie) + '</td></tr>' +
        '<tr><td class="cel l">TENSIÓN ' + LD[1] + '</td><td class="b l">' + esc(bt) + '</td><td class="cel l">MARCA</td><td class="b">' + esc(p.cab.marca) + '</td></tr>' +
        '<tr><td class="cel l">CONEXIÓN</td><td class="b l">' + esc(grupos) + '</td><td class="cel l">FECHA</td><td class="b">' + (B ? '' : esc(fechaTxt(p.cab.fecha))) + '</td></tr>' +
        '<tr><td class="cel l">POTENCIA</td><td class="b l">' + esc(pot) + '</td><td class="cel l">T° AMBIENTE</td><td class="b">' + (B || !OK(N(p.med.res.tmed)) ? '' : p.med.res.tmed) + ' °C</td></tr>') +
      '</table>';
  }

  // Bloques: html, filas fijas (≈6 mm) y filas para llenar
  var bloques = [], num = 0;
  function barra(txt) { num++; return '<div class="bar">' + num + '. ' + txt + '</div>'; }
  if (p.pruebas.ais) {
    var hA = barra('RESISTENCIA DE AISLAMIENTO (MΩ / GΩ)'), nA = 0;
    gruposAis(p.med.ais.rows).forEach(function (rows) {
      hA += '<table class="x">' + cols(rows.map(function () { return 100 / rows.length; })) +
        '<tr>' + rows.map(function (r) { return '<td class="b">' + esc(r.lbl) + ' (' + Calc.kv(r.v) + ' kV)</td>'; }).join('') + '</tr>' +
        '<tr class="fill">' + rows.map(function (r) { var o = ohmPartes(r.val); return llenar(o[0] === '' ? '' : o[0] + ' ' + o[1]); }).join('') + '</tr></table>';
      nA++;
    });
    bloques.push({ h: hA, fijas: 1 + nA, fill: nA });
  }
  if (p.pruebas.res) {
    var hR = barra('RESISTENCIA ÓHMICA DE LOS DEVANADOS'), nc = Math.max.apply(null, E.resRows.map(function (r) { return r.cols.length; }).concat([1]));
    hR += '<table class="x">' + cols([22].concat(Array(nc).fill(78 / nc)));
    E.resRows.forEach(function (r) {
      var et = E.tmm ? r.lbl : (r.lado === 'AT' ? LD[0] : LD[1]) + ' ' + tens(r.v);
      var relleno = r.cols.length < nc ? '<td colspan="' + (nc - r.cols.length) + '"></td>' : '';
      hR += '<tr><td rowspan="2" class="b">' + esc(et) + '<br>(' + r.u + ')</td>' + r.cols.map(function (c) { return '<td class="b">' + c.replace('-', ' - ') + '</td>'; }).join('') + relleno + '</tr>' +
        '<tr class="fill">' + r.cols.map(function (c, i) { return llenar(dd(r.vals[i])); }).join('') + relleno + '</tr>';
    });
    hR += '</table>';
    bloques.push({ h: hR, fijas: 1 + E.resRows.length, fill: E.resRows.length });
  }
  if (p.pruebas.rel) {
    var primero = true;
    E.rels.forEach(function (nv) {
      var nb = nv.bornes.length, wl = [9, 11, 9, 13].concat(Array(nb).fill(48 / nb)).concat([10]);
      var hL = (primero ? barra('RELACIÓN DE TRANSFORMACIÓN') : '') +
        '<div class="sub">' + LD[0] + ' ' + tens(nv.v) + ' / ' + LD[1] + ' ' + tens(nv.vbt) + ' – ' + esc(nv.g) + '</div>' +
        '<table class="x">' + cols(wl) +
        '<tr><td rowspan="2" class="b">Pos.</td><td colspan="2" class="b">TENSIONES</td><td rowspan="2" class="b">Relación teórica</td>' +
        nv.bornes.map(function (b) { return '<td class="b">' + b[0].replace('-', ' - ') + '</td>'; }).join('') + '<td rowspan="2" class="b">% Error</td></tr>' +
        '<tr><td class="b">V1</td><td class="b">V2</td>' + nv.bornes.map(function (b) { return '<td class="b">' + b[1].replace('-', ' - ') + '</td>'; }).join('') + '</tr>';
      nv.filas.forEach(function (f) {
        hL += '<tr class="fill' + (f.ti === nv.n && nv.n > 0 ? ' b' : '') + '"><td>' + f.label + '</td><td>' + Math.round(f.vat) + '</td><td>' + nv.vbt + '</td><td class="b teo">' + Calc.fmtRel(f.teo) + '</td>' +
          nv.bornes.map(function (b, i) { return llenar(d3(f.lect[i])); }).join('') + '<td>' + (B || !OK(f.err) ? '' : F(f.err, 2) + ' %') + '</td></tr>';
      });
      hL += '</table>';
      bloques.push({ h: hL, fijas: (primero ? 1 : 0) + 3, fill: nv.filas.length });
      primero = false;
    });
  }

  // Reparto en hojas: filas fijas ≈ 6 mm y filas para llenar de al menos 10 mm (alto útil ≈ 270 mm)
  var paginas = [[]], usado = 6 * 6;
  bloques.forEach(function (b) {
    var alto = b.fijas * 6 + b.fill * 10;
    if (paginas[paginas.length - 1].length && usado + alto > 270) { paginas.push([]); usado = 3 * 6; }
    paginas[paginas.length - 1].push(b.h); usado += alto;
  });
  return paginas.map(function (pg, i) {
    return (opts.wrap ? '<div class="hoja-wrap">' : '') + '<div class="hoja vert serv' + (B ? ' blank' : '') + '"><div class="hoja-in"><div class="marco">' +
      cabecera(i + 1, paginas.length) + pg.join('') + '</div></div></div>' + (opts.wrap ? '</div>' : '');
  }).join('');
}
// Agranda las filas para llenar de una hoja de servicio hasta ocupar el alto disponible
function rellenarServicio(hojaIn) {
  var marco = hojaIn.querySelector('.marco'), filas = hojaIn.querySelectorAll('tr.fill');
  if (!marco || !filas.length) return;
  var libre = hojaIn.clientHeight - marco.offsetHeight - 2;
  if (libre <= 0) return;
  var extra = libre / filas.length, maxPx = 30 * 96 / 25.4;
  Array.prototype.forEach.call(filas, function (tr) { tr.style.height = Math.min(maxPx, tr.offsetHeight + extra) + 'px'; });
}

/* ===== Formularios del asistente ===== */
function inp(k, v, o) {
  o = o || {};
  return '<input' + (o.cls ? ' class="' + o.cls + '"' : '') + ' data-k="' + k + '"' + (o.s ? ' data-s="1"' : '') +
    (o.type ? ' type="' + o.type + '"' : '') + (o.num ? ' inputmode="decimal"' : '') +
    ' value="' + esc(v === undefined || v === null ? '' : v) + '"' + (o.ph !== undefined && o.ph !== '' ? ' placeholder="' + esc(o.ph) + '"' : '') +
    (o.list ? ' list="' + o.list + '"' : '') + (o.w ? ' style="width:' + o.w + '"' : '') + (o.req ? ' data-req="1"' : '') + '>';
}
function sel(k, v, ops, o) {
  o = o || {};
  return '<select data-k="' + k + '"' + (o.s ? ' data-s="1"' : '') + (o.w ? ' style="width:' + o.w + '"' : '') + '>' + ops.map(function (x) {
    var val = Array.isArray(x) ? x[0] : x, lab = Array.isArray(x) ? x[1] : x;
    return '<option value="' + esc(val) + '"' + (String(val) === String(v === undefined || v === null ? '' : v) ? ' selected' : '') + '>' + esc(lab) + '</option>';
  }).join('') + '</select>';
}
function chk(k, v, label, o) {
  o = o || {};
  return '<label class="chk"><input type="checkbox" data-k="' + k + '"' + (o.s !== false ? ' data-s="1"' : '') + (v ? ' checked' : '') + '> ' + label + '</label>';
}
function campo(label, html, cls) { return '<label class="campo' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span>' + html + '</label>'; }
function calc(id, txt, cls) { return '<span class="calc' + (cls ? ' ' + cls : '') + '" data-c="' + id + '">' + (txt === '' || txt === undefined ? '—' : txt) + '</span>'; }
function boton(accion, txt, o) { o = o || {}; return '<button class="' + (o.cls || 'btn') + '" data-a="' + accion + '"' + (o.arg !== undefined ? ' data-arg="' + esc(o.arg) + '"' : '') + (o.title ? ' title="' + esc(o.title) + '"' : '') + '>' + txt + '</button>'; }
function resTxt(okv) { return okv === true ? 'CONFORME' : okv === false ? 'NO CONFORME' : ''; }
function resCls(okv) { return okv === true ? 'ok' : okv === false ? 'bad' : ''; }

/* ===== Exportación a Excel (.xlsx) con el formato de los protocolos EVI (columnas B a M, fórmulas visibles) ===== */
function exportarExcel(p, cfg) {
  var E = estructura(p, cfg), t = p.tec, ws = {}, merges = [], alturas = [], r = 2, numSec = 0;
  var CEL = '0DC0FF', BAR = '00B0F0', NC = 12; // columnas B..M = 1..12
  var colNotas = NC, filaNotas = 0; // notas fuera del área de impresión
  function borde(c) {
    var th = { style: 'thin', color: { rgb: '000000' } }, md = { style: 'medium', color: { rgb: '000000' } };
    return { top: th, bottom: th, left: c === 1 ? md : th, right: c === NC ? md : th };
  }
  function estilo(o, c) {
    o = o || {};
    var s = {
      font: { name: 'Arial', sz: o.sz || 9, bold: !!o.b, color: { rgb: o.blanco ? 'FFFFFF' : '000000' } },
      alignment: { horizontal: o.al || 'center', vertical: 'center', wrapText: !!o.wrap },
      border: borde(c)
    };
    if (o.fill) s.fill = { patternType: 'solid', fgColor: { rgb: o.fill } };
    return s;
  }
  function A(c, rr) { return XLSX.utils.encode_cell({ c: c, r: rr === undefined ? r : rr }); }
  function abs(ref) { return ref.replace(/^([A-Z]+)(\d+)$/, '$$$1$$$2'); }
  function IFE(f) { return 'IFERROR(' + f + ',"")'; }
  function zD(v) { v = N(v); return OK(v) && Math.abs(v) >= 10 ? '0.00' : '0.000'; } // 3 decimales bajo 10, si no 2
  function celda(c, v, o) {
    o = o || {};
    var cell;
    if (v && typeof v === 'object' && v.f) {
      cell = { t: 'n', f: v.f };
      if (typeof v.v === 'number' && OK(v.v)) cell.v = v.v;
      else if (typeof v.v === 'string') { cell.t = 's'; cell.v = v.v; }
    } else if (typeof v === 'number') cell = OK(v) ? { t: 'n', v: v } : { t: 's', v: '' };
    else {
      var txt = v === undefined || v === null ? '' : String(v).replace(/ /g, ' ');
      var n = N(txt);
      cell = (!o.txt && txt !== '' && OK(n) && /^\s*-?[\d.,]+\s*$/.test(txt)) ? { t: 'n', v: n } : { t: 's', v: txt };
    }
    cell.s = estilo(o, c);
    if (o.z) cell.z = o.z;
    ws[A(c)] = cell;
    return A(c);
  }
  // Escribe una fila: items = [valor, columnas, opciones{rs: filas combinadas, ...}]; salto(n) deja columnas ocupadas por una combinación de arriba
  function fila(items, alto) {
    var c = 1, refs = [];
    items.forEach(function (it) {
      if (it[0] === null && it[2] && it[2].skip) { c += it[1]; refs.push(null); return; }
      var span = it[1] || 1, o = it[2] || {}, rs = o.rs || 1;
      refs.push(celda(c, it[0], o));
      for (var k = 0; k < span; k++) for (var q = 0; q < rs; q++) if (k || q) {
        var a = A(c + k, r + q);
        if (!ws[a]) ws[a] = { t: 's', v: '', s: estilo(o, c + k) };
      }
      if (span > 1 || rs > 1) merges.push({ s: { c: c, r: r }, e: { c: c + span - 1, r: r + rs - 1 } });
      c += span;
    });
    if (alto) alturas[r] = alto;
    r++;
    return refs;
  }
  function salto(n) { return [null, n, { skip: true }]; }
  function barra(txt, fill) { fila([[txt, NC, { b: true, fill: fill || BAR, blanco: true, al: 'left' }]]); }
  function seccion(id, extra) {
    numSec++;
    var it = instTxt(cfg, p.inst[id]);
    barra(numSec + '. ' + TITULOS_EVI[id] + (extra ? ' ' + extra : '') + (it ? ' (' + it + ')' : ''));
  }

// Datos de una imagen data: URL → {bytes, ext, w, h}
function imgDatos(src) {
  var m = String(src).match(/^data:image\/(png|jpe?g);base64,(.*)$/); if (!m) return null;
  var bin = atob(m[2]), u = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  var w = 0, h = 0, ext = m[1] === 'png' ? 'png' : 'jpeg';
  if (ext === 'png') { w = (u[16] << 24 | u[17] << 16 | u[18] << 8 | u[19]) >>> 0; h = (u[20] << 24 | u[21] << 16 | u[22] << 8 | u[23]) >>> 0; }
  else {
    for (var o = 2; o < u.length - 9;) {
      if (u[o] !== 0xFF) { o++; continue; }
      var mk = u[o + 1], len = u[o + 2] << 8 | u[o + 3];
      if (mk >= 0xC0 && mk <= 0xCF && mk !== 0xC4 && mk !== 0xC8 && mk !== 0xCC) { h = u[o + 5] << 8 | u[o + 6]; w = u[o + 7] << 8 | u[o + 8]; break; }
      o += 2 + len;
    }
  }
  return w && h ? { bytes: u, ext: ext, w: w, h: h } : null;
}

// A4 vertical ajustado a 1 página de ancho + firmas escaneadas (SheetJS no escribe esto por sí solo)

    function leer(ruta) { var e = XLSX.CFB.find(zip, '/' + ruta) || XLSX.CFB.find(zip, ruta); return e ? dec.decode(e.content) : null; }

    var lista = (imgs || []).map(function (x) { var d = imgDatos(x.src); if (d) d.pos = x; return d; }).filter(Boolean);

          '<xdr:ext cx="' + w * EMU + '" cy="' + h * EMU + '"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="' + (n + 1) + '" name="Firma ' + n + '"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>' +

      });

      XLSX.CFB.utils.cfb_add(zip, 'xl/drawings/_rels/drawing1.xml.rels', enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rels + '</Relationships>'));
      var rDr = '<Relationship Id="rIdDr1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/>';
      var sr = leer('xl/worksheets/_rels/sheet1.xml.rels');

      // El orden del esquema exige <drawing> después de <ignoredErrors>; si no, Excel da el archivo por dañado

// Reubica las lecturas de relación al quitar la tensión alta "nivelQ" o la tensión baja "btQ"
function reindexarRel(nivelQ, btQ) {
  var nuevo = {};
  Object.keys(P.med.rel).forEach(function (k) {
    var s = k.split('_'), i = +s[0], j = +(s[1] || 0);
    if (i === nivelQ || j === btQ) return;
    if (nivelQ !== null && i > nivelQ) i--;
    if (btQ !== null && j > btQ) j--;
    nuevo[relKey(i, j)] = P.med.rel[k];
  });
  P.med.rel = nuevo;
  if (nivelQ !== null) P.med.cc.rows.forEach(function (r) { if (+r.nivel > nivelQ) r.nivel = +r.nivel - 1; else if (+r.nivel === nivelQ) r.nivel = 0; });
}
function limpiarMediciones(q) {
  var t = TIPOS[q.tipo];
  q.med.ais.rows.forEach(function (r) { r.val = ''; });
  q.med.res.v = {}; q.med.res.tmed = '';
  Object.keys(q.med.rel).forEach(function (k) { q.med.rel[k].lect = {}; });
  q.med.vac.I = ['', '', '']; q.med.vac.W = ['', '', ''];
  q.med.cc.rows.forEach(function (r) { r.I = ''; r.V = ''; r.W = ['', '', '']; r.tamb = ''; });
  q.med.apl.rows.forEach(function (r) { r.mA = ''; r.res = ''; });
  q.med.ind.I = ''; q.med.ind.res = '';
  q.med.ace.lect = ['', '', '', '', '', '']; q.med.ace.tamb = '';
  q.med.pre = { tt: {}, tc: {} }; q.med.rui.db = '';
}

/* ---------- Archivos ---------- */
// En la versión web (enlace de claude.ai) la descarga pasa por la confirmación del visor; abierto como archivo, descarga directa
var DESCARGAS = null;
try { if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { DESCARGAS = d; }, function () { }); } catch (e) { }
function descargar(nombre, contenido, tipo) {
  var b = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo || 'application/json' });
  if (DESCARGAS) {
    DESCARGAS.save({ filename: nombre, data: b }).catch(function (e) { if (e && e.code !== 'declined') aviso('No se pudo descargar: ' + (e.message || e.code)); });
    return;
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function leerArchivo(el) {
  var f = el.files[0], tipo = el.getAttribute('data-file'), arg = el.getAttribute('data-arg');
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    if (tipo === 'json') return importarJSON(rd.result);
    reducirImagen(rd.result, tipo === 'hoja' ? 1240 : 500, function (url) {
      if (tipo === 'hoja') { CFG.hoja = url; guardarCfg(); renderAjustes(); render(); }
      if (tipo === 'firma') {
        P.firmas[+arg].img = url;
        if (P.firmas[+arg].nombre) { CFG.firmasImg[P.firmas[+arg].nombre] = url; guardarCfg(); }
        cambio(true);
      }
    });
  };
  if (tipo === 'json') rd.readAsText(f); else rd.readAsDataURL(f);
  el.value = '';
}
function reducirImagen(url, maxW, cb) {
  var img = new Image();
  img.onload = function () {
    var esc = Math.min(1, maxW / img.width), c = document.createElement('canvas');
    c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(maxW > 1000 ? c.toDataURL('image/jpeg', 0.82) : c.toDataURL('image/png'));
  };
  img.onerror = function () { aviso('No se pudo leer la imagen.'); };
  img.src = url;
}
function importarJSON(txt) {
  var d;
  try { d = JSON.parse(txt); } catch (e) { aviso('El archivo no es un JSON válido.'); return; }
  var lista = d.protocolos || (Array.isArray(d) ? d : d.tipo ? [d] : []);
  var n = 0, rep = 0;
  lista.forEach(function (q) {
    if (!q || !q.id || !q.tipo || !TIPOS[q.tipo]) return;
    var i = DB.findIndex(function (x) { return x.id === q.id; });
    if (i >= 0) { DB[i] = q; rep++; } else { DB.unshift(q); n++; }
  });
  if (d.cfg && confirm('El archivo trae ajustes (instrumentos, personas, logo, modelos). ¿Reemplazar los ajustes actuales?')) { CFG = Object.assign(cfgDefecto(), d.cfg); guardarCfg(); }
  lsSet(K_DB, DB); renderDB(); render();
  aviso('Importados: ' + n + ' nuevos, ' + rep + ' actualizados.');
}

  el.innerHTML = '<datalist id="dl-tec">' + CFG.personas.tecnicos.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
    '<datalist id="dl-sup">' + CFG.personas.supervisores.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
}
var _render = render;
render = function () { actualizarListasPersonas(); _render(); };
